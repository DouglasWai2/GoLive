services:
  - type: cron
    name: golive-empty-room-cleanup
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: npm ci && npm run build -w @golive/core && npm run build -w @golive/server
    startCommand: npm run cleanup:empty-rooms -w @golive/server
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
